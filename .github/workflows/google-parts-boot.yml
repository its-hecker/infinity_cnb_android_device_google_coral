name: Check GoogleParts boot integration

on:
  workflow_dispatch:
  push:
    branches: [cnb-Latest-stable, features-experimental]
    paths:
      - '.github/workflows/google-parts-boot.yml'
      - 'parts/AndroidManifest.xml'
      - 'parts/Android.bp'
      - 'parts/src/org/lineageos/settings/BootCompletedReceiver.java'
      - 'parts/src/org/lineageos/settings/EuiccDisabler.java'
  pull_request:
    branches: [cnb-Latest-stable, features-experimental]
    paths:
      - '.github/workflows/google-parts-boot.yml'
      - 'parts/AndroidManifest.xml'
      - 'parts/Android.bp'
      - 'parts/src/org/lineageos/settings/BootCompletedReceiver.java'
      - 'parts/src/org/lineageos/settings/EuiccDisabler.java'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
      - name: Compile boot integration against Android APIs
        run: |
          javac --release 11 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$RUNNER_TEMP/google-parts-boot-classes" \
            parts/src/org/lineageos/settings/BootCompletedReceiver.java \
            parts/src/org/lineageos/settings/EuiccDisabler.java
