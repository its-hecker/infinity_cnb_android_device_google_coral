name: Check Google Pokemon wallpaper migration

on:
  workflow_dispatch:
  push:
    branches: [features-experimental]
    paths:
      - '.github/workflows/google-pokemon.yml'
      - 'parts/AndroidManifest.xml'
      - 'parts/Android.bp'
      - 'parts/src/org/lineageos/settings/BootCompletedReceiver.java'
      - 'parts/src/org/lineageos/settings/PokemonWallpaperEnabler.java'
      - 'parts/src/org/lineageos/settings/EuiccDisabler.java'
  pull_request:
    branches: [features-experimental]
    paths:
      - '.github/workflows/google-pokemon.yml'
      - 'parts/AndroidManifest.xml'
      - 'parts/Android.bp'
      - 'parts/src/org/lineageos/settings/BootCompletedReceiver.java'
      - 'parts/src/org/lineageos/settings/PokemonWallpaperEnabler.java'
      - 'parts/src/org/lineageos/settings/EuiccDisabler.java'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API
        run: sdkmanager 'platforms;android-35'
      - name: Compile migration and boot integration against Android APIs
        run: |
          javac --release 11 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$RUNNER_TEMP/google-pokemon-classes" \
            parts/src/org/lineageos/settings/PokemonWallpaperEnabler.java \
            parts/src/org/lineageos/settings/BootCompletedReceiver.java \
            parts/src/org/lineageos/settings/EuiccDisabler.java
